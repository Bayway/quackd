name: toddlerbot contract

# quackd's real client against quackd's real daemon on upstream's real physics body.
#
# This is the only job that installs upstream, and it is deliberately not part of `ci`: the
# main suite has to stay installable on Windows with nothing but quackd's own dependencies.
# It runs nightly and on demand, and it is allowed to fail without blocking a release,
# because what it watches for is upstream drift rather than a regression in this repository.
#
# Nothing here has run on a robot. A green run means the protocol, the fifty hertz loop and
# the deadman hold up against 30 simulated motors, and no more than that.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toddlerbot-contract
  cancel-in-progress: true

jobs:
  contract:
    name: quackd ⇄ daemon ⇄ MuJoCo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      # Upstream never reads MUJOCO_GL, and the headless path builds neither a viewer nor a
      # renderer, so no GL context is created and osmesa/xvfb are not needed. What IS needed
      # is that `import mujoco.viewer` succeeds, because mujoco_sim imports it at module
      # scope before it looks at vis_type, and that import loads glfw's shared library.
      MPLBACKEND: Agg
      TODDLERBOT_ROOT: ${{ github.workspace }}/upstream
      QUACKD_TODDLERBOT_CONTRACT: "1"

    steps:
      - uses: actions/checkout@v7

      - name: System libraries glfw and cv2 dlopen
        # Not a display: these are the client libraries glfw and OpenCV load at import.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1 libglib2.0-0

      - name: Blobless sparse checkout of upstream
        # The repository is about 1.2 GB with no LFS, and 860 MB of that is descriptions/.
        # This takes the Python the sim path imports, the model, its 47 meshes and the five
        # keyframe motions quackd offers: roughly 70 MB.
        run: |
          git clone --filter=blob:none --sparse \
            https://github.com/hshi74/toddlerbot.git upstream
          cd upstream
          git checkout 84e02d14261292eec5d06f896e3145b35c54856c
          git sparse-checkout set --no-cone \
            '/toddlerbot/__init__.py' \
            '/toddlerbot/sim/*.py' \
            '/toddlerbot/utils/*.py' \
            '/toddlerbot/descriptions/default.yml' \
            '/toddlerbot/descriptions/toddlerbot_2xc/*.xml' \
            '/toddlerbot/descriptions/toddlerbot_2xc/robot.yml' \
            '/toddlerbot/descriptions/toddlerbot_2xc/assets/*.stl' \
            '/motion/hold_2xc.lz4' \
            '/motion/kneel_2xc.lz4' \
            '/motion/cuddle_2xc.lz4' \
            '/motion/push_up_2xc.lz4' \
            '/motion/crawl_2xc.lz4'
          du -sh .

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync quackd
        run: uv sync --python 3.11 --extra dev

      - name: Install what the sim path actually imports
        # Never `pip install .` on upstream: its build backend compiles a Dynamixel pybind11
        # extension this path never imports. mujoco is not a declared dependency there at all
        # (it arrives unpinned through brax), so it is pinned here instead. PyYAML is not
        # declared either, though sim/robot.py imports it. scipy must be 1.14 or newer:
        # the free-base observation calls Rotation.from_quat(scalar_first=True), which 1.13
        # does not have.
        run: |
          uv pip install \
            'mujoco==3.3.4' \
            'numpy==1.26.4' \
            'scipy>=1.14' \
            'PyYAML>=6' \
            'jax==0.4.28' 'jaxlib==0.4.28' \
            'matplotlib' \
            'moviepy==1.0.3' \
            'opencv-python-headless' \
            'joblib' 'lz4'

      - name: Prove the imports before blaming the protocol
        # Each of these isolates a distinct failure class, cheapest first.
        working-directory: upstream
        run: |
          uv run python -c "import glfw, mujoco.viewer; print('glfw ok')"
          uv run python -c "import cv2; print('cv2', cv2.__version__)"
          uv run python -c "import joblib, lz4; print('joblib ok')"

      - name: The daemon starts and reports what it found
        working-directory: upstream
        run: |
          uv run python "$GITHUB_WORKSPACE/bridge/toddlerbot/quackd_toddlerbot_bridge.py" \
            --sim mujoco --robot toddlerbot_2xc --toddlerbot . --once

      - name: Contract
        run: uv run pytest -q tests/test_toddlerbot_contract.py -p no:randomly

      - name: Say what upstream looked like
        if: always()
        run: |
          cd upstream && git log -1 --format='upstream %H %ci'
