name: refresh the simulator

# The browser demo lives here in `web/`, but the page that serves it to the public is built by a
# different repository: quackd-web owns www.quackd.org, and its build fetches this directory into
# `/simulator` at build time. That is what makes the demo reachable without a second Vercel project
# or a subdomain — and it is also why a push here does not, on its own, change anything a visitor
# can see. The landing page has to rebuild before the fetched copy is refreshed.
#
# This is that trigger, and nothing else. It pings a Vercel deploy hook, which starts a build of
# quackd-web against its own main. It ships no code and reads no secret beyond the hook URL.
#
# The hook is a URL that starts a deployment for whoever holds it, so it is a secret in the real
# sense. It lives in `VERCEL_DEPLOY_HOOK`. Until that secret exists the job says so and stops,
# rather than failing: a fork, and this repository before the hook is created, should not show a
# red mark for a deployment they were never going to trigger.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/refresh-the-simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

# One rebuild for a burst of pushes. The hook takes no arguments, so a queued second ping would
# build the same commit twice.
concurrency:
  group: refresh-the-simulator
  cancel-in-progress: true

jobs:
  ping:
    name: ask quackd-web to rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork gets no secrets, and pinging the upstream site from a fork would be wrong even if it
    # could. This is the same guard the other network jobs use.
    if: github.repository == 'rokbenko/quackd'
    steps:
      - name: ping the deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK secret is set, so there is nothing to ping."
            echo "Create a deploy hook on the quackd-web Vercel project and add it as that secret."
            exit 0
          fi
          # --fail turns an HTTP error into a non-zero exit; without it curl reports success on a
          # 404 and a silently dead hook would look like a working one for months.
          code=$(curl --silent --show-error --fail --location \
                      --request POST "$HOOK" \
                      --output /dev/null --write-out '%{http_code}')
          echo "deploy hook accepted the request (HTTP $code)"
